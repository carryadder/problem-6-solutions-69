# Production stack. Hardened in Phase 7.
# Usage:
#   cp .env.example .env.prod   # fill with prod values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--port", "6380"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      target: prod
    restart: always
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: redis://redis:6380
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        NEXT_PUBLIC_GTAG_ID: ${NEXT_PUBLIC_GTAG_ID}
    restart: always
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: 3002
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - backend

  # nginx:
  #   image: nginx:1.27-alpine
  #   restart: always
  #   depends_on:
  #     - frontend
  #     - backend
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - uploads:/var/www/uploads:ro
  #     # TLS certs would be mounted here in real prod (e.g. Let's Encrypt)
  #     # - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pg_data:
  redis_data:
  uploads:
